{% set name = "typing_extensions" %}
{% set version = "4.16.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: dc983d19a509c94dba722ee6abd33940f7c05a89e243c47e907eb4db6f1a43e5

build:
  number: 0
  skip: true  # [py<39]

# This recipe intentionally provides both 'typing_extensions' and
# 'typing-extensions'. The first is the actual package, while the second is a
# compatibility metapackage pinned to it. Some Anaconda Linter versions
# normalize underscores and hyphens and may therefore report these outputs as
# duplicates. The resulting dependency-check errors are cascading and are not
# related to the current version/SHA update.
outputs:
  - name: {{ name }}
    build:
      script: python -m pip install --no-deps --no-build-isolation --ignore-installed .

    requirements:
      host:
        - python
        - flit-core >=3.11,<4
        - pip
      run:
        - python

    test:
      imports:
        - typing_extensions
  # Compatibility metapackage for the hyphenated project name.
  - name: typing-extensions
    build:
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage(name, exact=True) }}
    test:
      imports:
        - typing_extensions
      requires:
        - pip
      commands:
        - pip check

about:
  home: https://github.com/python/typing_extensions
  license: PSF-2.0
  license_family: PSF
  license_file: LICENSE
  summary: Backported and Experimental Type Hints for Python
  description: |
    The typing module was added to the standard library in Python 3.5, but
    many new features have been added to the module since then.
    This means users of older Python versions who are unable to upgrade will not be
    able to take advantage of new types added to the typing module, such as
    typing.Protocol or typing.TypedDict.

    The typing_extensions module contains backports of these changes.
    Experimental types that will eventually be added to the ``typing``
    module are also included in typing_extensions.

  doc_url: https://typing-extensions.readthedocs.io
  dev_url: https://github.com/python/typing_extensions
extra:
  recipe-maintainers:
    - cbouss
  skip-lints:
    - outputs_not_unique
    - missing_pip_check
    - patch_unnecessary
    - missing_python_build_tool
    - wrong_output_script_key

{% set name = "grpc" %}
{% set version = "1.83.0" %}

# core package & vendored libs use different version scheme than CPP libs, see
# top of https://github.com/grpc/grpc/blob/v{{ version }}/CMakeLists.txt
# the difference of 27 is empirical, last changed in 1.80
{% set core_major = version.split(".")[1] | int - 27 %}
{% set core_version = core_major | string ~ ".0.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://github.com/grpc/grpc/archive/v{{ version.replace(".pre", "-pre") }}.tar.gz
  sha256: 90d453393a9d41215df546103b10b33b9566df79cdf6f49dc67f6c4d044d090d
  patches:
    - patches/0001-windows-ssl-lib-names.patch
    - patches/0002-fix-win-setup-cmds.patch
    - patches/0003-Link-against-grpc-and-abseil.patch
    - patches/0004-force-protoc-executable.patch
    # mark target_link_libraries for grpc as PRIVATE where possible
    - patches/0005-mark-linkages-of-grpc-_unsecure-as-private.patch
    # fix symbol visibility regression on windows
    - patches/0006-for-main-targets-set-_DLL_EXPORTS-when-building-and-.patch
    # get gRPC_BUILD_TESTS=ON to build
    - patches/0007-add-missing-linkages-for-gRPC_BUILD_TESTS-ON.patch
    # see https://github.com/grpc/grpc/pull/38893
    - patches/0008-add-enable_testing-so-tests-get-run.patch
    # protobuf is now shipping upb, so we cannot ship it here; see
    # https://github.com/protocolbuffers/protobuf/issues/12927
    # https://github.com/conda-forge/libprotobuf-feedstock/pull/240
    # https://github.com/grpc/grpc/commit/7819891fabcd1d2ff55c26c2b0755ab52ccd8e20
    - patches/0009-unvendor-upb-and-utf8_range-use-protobuf-s-version.patch
    # full test suite takes too long to build; reduce set of tests
    - patches/0010-reduce-buildtests_cxx-target-to-end2end-tests.patch
    # don't rebuild protobuf/upb/abseil for grpcio-tools
    - patches/0011-build-grpcio-tools-from-source.patch
    - patches/0012-reduce-grpc-symbol-explosion-with-autogenerated-expo.patch
    - patches/0013-update-GRPC_DLL-instances-where-necessary.patch
    - patches/0014-use-protobuf-s-libutf8_range.patch
    - patches/0015-disable-grpc-_unsecure.patch
    # backport https://github.com/grpc/grpc/pull/41909
    - patches/0016-break-out-_initialize_absl-into-separate-cython-modu.patch
    # silence absl::MutexLock(Mutex*) deprecation warnings on newer abseil
    - patches/0017-silence-absl-MutexLock-pointer-deprecation-warnings.patch
    # silence absl::Mutex::Lock()/Unlock() deprecation warnings on newer abseil
    - patches/0018-silence-absl-Mutex-Lock-Unlock-deprecation-warnings.patch
    # PKG-19090: backport https://github.com/grpc/grpc/pull/43699
    # Refreshes etc/roots.pem from the Chromium root store. Drops emSign ECC
    # Root CA - G3; keeps emSign Root CA - G1 (removed by patch 0020 below).
    # Applies cleanly to v1.83.0.
    - patches/0019-update-grpc-repo-roots.patch
    # Removes eMudhra emSign Root CA - G1 from etc/roots.pem (applies on top of 0019)
    - patches/0020-remove-emudhra-emsign-root-ca-g1.patch
build:
  number: 3

outputs:
  - name: libgrpc
    script: build-cpp.sh  # [not win]
    script: build-cpp.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage('libgrpc', max_pin='x.x') }}
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja-base
        - python        # [win]
        # for analysing total number of symbols in grpc.dll
        - py-lief       # [win]
      host:
        - libabseil {{ libabseil }}
        - c-ares {{ c_ares }}
        - libprotobuf {{ libprotobuf }}
        - re2 {{ re2 }}.*
        - openssl {{ openssl }}.*
        - zlib {{ zlib }}.*
      run_constrained:
        # make sure we don't co-install with old version of previous package name
        - grpc-cpp ={{ version }}
    test:
      requires:
        # protoc needs compiler; cmake also needs one to run package detection, see
        # https://discourse.cmake.org/t/questions-about-find-package-cli-msvc/6194
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja-base
        - pkg-config
        - re2 {{ re2 }}.*
      files:
        - cmake_test/
        - hello.proto
        - test_grpc.sh
        - test_grpc.bat
      source_files:
        - examples/
      commands:
        # libraries
        # presence of shared libs
        - test -f $PREFIX/lib/libgpr$SHLIB_EXT                     # [unix]
        - if not exist %LIBRARY_BIN%\gpr.dll exit 1                 # [win]
        - if not exist %LIBRARY_LIB%\gpr.lib exit 1                 # [win]
        - test -f $PREFIX/lib/libgrpc$SHLIB_EXT                    # [unix]
        - if not exist %LIBRARY_BIN%\grpc.dll exit 1                # [win]
        - if not exist %LIBRARY_LIB%\grpc.lib exit 1                # [win]
        - test -f $PREFIX/lib/libgrpc++$SHLIB_EXT                  # [unix]
        - if not exist %LIBRARY_BIN%\grpc++.dll exit 1              # [win]
        - if not exist %LIBRARY_LIB%\grpc++.lib exit 1              # [win]
        - test -f $PREFIX/lib/libaddress_sorting$SHLIB_EXT          # [unix]
        - if not exist %LIBRARY_BIN%\address_sorting.dll exit 1     # [win]
        - if not exist %LIBRARY_LIB%\address_sorting.lib exit 1     # [win]

        # absence of grpc{,++}_unsecure
        - test ! -f $PREFIX/lib/libgrpc_unsecure$SHLIB_EXT           # [unix]
        - test ! -f $PREFIX/lib/libgrpc++_unsecure$SHLIB_EXT         # [unix]
        - if exist %LIBRARY_BIN%\grpc_unsecure.dll exit 1           # [win]
        - if exist %LIBRARY_BIN%\grpc++_unsecure.dll exit 1         # [win]
        - if exist %LIBRARY_LIB%\grpc_unsecure.lib exit 1           # [win]
        - if exist %LIBRARY_LIB%\grpc++_unsecure.lib exit 1         # [win]

        # absence of static libs (unix)
        - test ! -f $PREFIX/lib/libgpr.a                            # [unix]
        - test ! -f $PREFIX/lib/libgrpc.a                           # [unix]
        - test ! -f $PREFIX/lib/libgrpc++.a                         # [unix]
        - test ! -f $PREFIX/lib/libaddress_sorting.a                # [unix]

        # binaries
        - test -f $PREFIX/bin/grpc_cpp_plugin                       # [unix]
        - if not exist %LIBRARY_BIN%\grpc_cpp_plugin.exe exit 1     # [win]
        - test -f $PREFIX/bin/grpc_csharp_plugin                    # [unix]
        - if not exist %LIBRARY_BIN%\grpc_csharp_plugin.exe exit 1  # [win]
        - test -f $PREFIX/bin/grpc_node_plugin                      # [unix]
        - if not exist %LIBRARY_BIN%\grpc_node_plugin.exe exit 1    # [win]
        - test -f $PREFIX/bin/grpc_objective_c_plugin               # [unix]
        - if not exist %LIBRARY_BIN%\grpc_objective_c_plugin.exe exit 1  # [win]
        - test -f $PREFIX/bin/grpc_php_plugin                       # [unix]
        - if not exist %LIBRARY_BIN%\grpc_php_plugin.exe exit 1     # [win]
        - test -f $PREFIX/bin/grpc_python_plugin                    # [unix]
        - if not exist %LIBRARY_BIN%\grpc_python_plugin.exe exit 1  # [win]
        - test -f $PREFIX/bin/grpc_ruby_plugin                      # [unix]
        - if not exist %LIBRARY_BIN%\grpc_ruby_plugin.exe exit 1    # [win]

        # pkg-config (no metadata for vendored libs)
        # a number of dependencies do not have pkgconfig files on windows. e.g. re2
        - pkg-config --print-errors --exact-version "{{ core_version }}" gpr     # [not win]
        - pkg-config --print-errors --exact-version "{{ core_version }}" grpc    # [not win]
        - pkg-config --print-errors --exact-version "{{ version }}" grpc++       # [not win]

        # CMake test: compile upstream example
        - ./test_grpc.sh   # [unix]
        - ./test_grpc.bat  # [win]

        # test availability of symbol needed by arrow (esp. on windows)
        - cd cmake_test
        - cmake -GNinja -DCMAKE_CXX_STANDARD=17 $CMAKE_ARGS .   # [unix]
        - cmake -GNinja -DCMAKE_CXX_STANDARD=17 %CMAKE_ARGS% .  # [win]
        - cmake --build .

  - name: grpcio
    script: build-grpcio.sh  # [not win]
    script: build-grpcio.bat  # [win]
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
      host:
        - python
        - pip
        - setuptools >=77.0.1
        # 3.3.0 emits ::isfinite; GCC 14 -std=c++17 does not declare it (cython#7915). 3.3.1 is not on main.
        - cython 3.2.9
        - libabseil 20260526.0
        - {{ pin_subpackage('libgrpc', exact=True) }}
        - pthread-stubs ==0.3                     # [linux]
      run:
        - python
        - typing-extensions >=4.12.2,<5
        - {{ pin_subpackage('libgrpc', exact=True) }}
    test:
      source_files:
        - examples/python/helloworld/
        - examples/protos/helloworld.proto
      files:
        - grpcio_distribtest.py
        - test_grpcio_helloworld.py
      requires:
        - pip
        - grpcio-tools
      imports:
        - grpc
        - grpc._cython
        - grpc._cython._cygrpc
        - grpc.beta
        - grpc.framework
        - grpc.framework.common
        - grpc.framework.foundation
        - grpc.framework.interfaces
        - grpc.framework.interfaces.base
        - grpc.framework.interfaces.face
      commands:
        - python -m pip check
        # PKG-19090: packaged roots must not trust emSign ECC Root CA - G3
        - python -c "from pathlib import Path; import grpc; p = Path(grpc.__file__).resolve().parent / '_cython' / '_credentials' / 'roots.pem'; assert 'emSign ECC Root CA - G3' not in p.read_text(), p"
        # packaged roots must not trust eMudhra emSign Root CA - G1 either
        - python -c "from pathlib import Path; import grpc; p = Path(grpc.__file__).resolve().parent / '_cython' / '_credentials' / 'roots.pem'; assert 'emSign Root CA - G1' not in p.read_text(), p"
        - python grpcio_distribtest.py
        # the following test is flaky on pypy
        # test actual RPC pattern (client & server); other tests did not catch
        # https://github.com/conda-forge/grpc-cpp-feedstock/issues/281
        - cd examples/python/helloworld
        # generate helloworld, see https://grpc.io/docs/languages/python/quickstart/#generate-grpc-code
        - python -m grpc_tools.protoc -I../../protos --python_out=. --pyi_out=. --grpc_python_out=. ../../protos/helloworld.proto
        # copy test defined in feedstock to where it needs to run
        - cp ../../../test_grpcio_helloworld.py .                                # [unix]
        - copy ..\..\..\test_grpcio_helloworld.py .                              # [win]
        - python test_grpcio_helloworld.py

  - name: grpcio-tools
    script: build-grpcio-tools.sh  # [not win]
    script: build-grpcio-tools.bat  # [win]
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
      host:
        - grpcio ={{ version }}=*_{{ PKG_BUILDNUM }}
        - python
        - wheel
        # same GCC 14 / cython 3.3.0 isfinite break as grpcio (cython#7915)
        - cython 3.2.9
        - pip
        - setuptools >=77.0.1
        - libabseil 20260526.0
        - libprotobuf 7.35.1
      run:
        - grpcio ={{ version }}=*_{{ PKG_BUILDNUM }}
        - python
        - setuptools >=77.0.1
        - protobuf >=7.35.1,<8.0.0
    test:
      requires:
        - pip
      imports:
        - grpc_tools
      commands:
        - pip check
        # see https://github.com/conda-forge/grpc-cpp-feedstock/issues/385
        - test "$(python -m grpc_tools.protoc --version)" == "$(protoc --version)"  # [unix]

about:
  home: https://grpc.io
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: gRPC - A high-performance, open-source universal RPC framework
  description: |
    gRPC is a modern, open source, high-performance remote procedure call
    (RPC) framework that can run anywhere. gRPC enables client and server
    applications to communicate transparently, and simplifies the building
    of connected systems.

    This package contains the gRPC C++ libraries and header files, as well
    as the code generation plugins.
  doc_url: https://grpc.io/docs
  dev_url: https://github.com/grpc/grpc

extra:
  recipe-maintainers:
    - pitrou
    - xhochy
    - wesm
    - h-vetinari
    - mariusvniekerk
    - jjerphan
    - JohanMabille
  feedstock-name: grpc-cpp
